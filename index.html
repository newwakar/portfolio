<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Freelance software engineer offering web development, mobile apps, and custom solutions.">
    <title>Freelance Software Engineer – Web & Mobile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <nav class="navbar">
            <div class="container">
                <a href="#" class="logo">DevPro</a>
                <ul class="nav-links">
                    <li><a href="#services">Services</a></li>
                    <li><a href="#pricing">Pricing</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Hero -->
    <section class="hero">
        <div class="container">
            <h1>Build the Future, One Line of Code at a Time</h1>
            <p>Freelance software engineer creating modern, scalable web & mobile solutions.</p>
            <a href="#contact" class="cta-button">Get in Touch</a>
        </div>
    </section>

    <!-- Search -->
    <section class="search-section">
        <div class="container">
            <input type="text" id="searchInput" class="search-bar" placeholder="Search services...">
        </div>
    </section>

    <!-- Services (Horizontal Scroll) -->
    <section id="services" class="services">
        <div class="container">
            <h2>What I Offer</h2>
            <div id="servicesGrid" class="services-grid"></div>
        </div>
    </section>

    <!-- Pricing (Vertical) -->
    <section id="pricing" class="pricing">
        <div class="container">
            <h2>Pricing Plans</h2>
            <div id="pricingGrid" class="pricing-grid"></div>
        </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="contact">
        <div class="container">
            <h2>Let’s Work Together</h2>
            <form class="contact-form" action="https://formspree.io/f/xxxxx" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="_replyto" placeholder="Your Email" required>
                <textarea name="message" placeholder="Describe your project..." rows="5" required></textarea>
                <button type="submit" class="submit-button">Send Message</button>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
