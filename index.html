<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Freelance software engineer offering web development, mobile apps, and custom solutions. Affordable rates and quality work.">
    <meta name="keywords" content="freelance software engineer, web development, mobile apps, coding services, affordable">
    <meta name="author" content="Your Name">
    <title>Freelance Software Engineer - Web & Mobile Development Services</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <div class="logo">💻 Dev Services</div>
                <ul class="nav-links">
                    <li><a href="#services">Services</a></li>
                    <li><a href="#pricing">Pricing</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="container">
                <h1>Freelance Software Engineer</h1>
                <p>Quality code, affordable rates, fast delivery</p>
                <a href="#contact" class="cta-button">Get Started</a>
            </div>
        </section>

        <!-- Search Bar -->
        <section class="search-section">
            <div class="container">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-bar" 
                    placeholder="Search services (e.g., 'web development', 'React', 'API')..."
                >
            </div>
        </section>

        <!-- Services Section -->
        <section id="services" class="services">
            <div class="container">
                <h2>Services</h2>
                <div class="services-grid" id="servicesGrid">
                    <!-- Services will be populated by JavaScript -->
                </div>
            </div>
        </section>

        <!-- Pricing Section -->
        <section id="pricing" class="pricing">
            <div class="container">
                <h2>Pricing</h2>
                <div class="pricing-grid" id="pricingGrid">
                    <!-- Pricing will be populated by JavaScript -->
                </div>
            </div>
        </section>

        <!-- Contact Section -->
        <section id="contact" class="contact">
            <div class="container">
                <h2>Get in Touch</h2>
                <form class="contact-form">
                    <input type="text" placeholder="Your Name" required>
                    <input type="email" placeholder="Your Email" required>
                    <textarea placeholder="Describe your project..." rows="5" required></textarea>
                    <button type="submit" class="submit-button">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Freelance Software Engineer. All rights reserved.</p>
            <p>📧 your.email@example.com | 📱 +1 (555) 123-4567</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
